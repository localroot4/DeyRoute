# Stable releases start here, by hand: Actions → tag-release → Run workflow,
# on main, with the version (X.Y.Z). It checks that CHANGELOG.md on main has
# the section "## [X.Y.Z] - <date>", tags the tip of main vX.Y.Z and starts
# the full ci.yml run at that tag (every distro, every scenario); its release
# job publishes the release only when every job passed (docs/dev/
# RELEASING.md). Pushing the tag by hand does the same through the push
# event.
#
# A tag pushed with the workflow token starts no workflow, so this run starts
# ci.yml itself (workflow_dispatch is the one event that token may start).
name: tag-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the stable version to release, X.Y.Z (CHANGELOG.md on main needs its section)"
        required: true
      replace:
        description: "move the tag of a version that has no GitHub release yet to the tip of main (after a failed release run)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: tag main and start the release run
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the version must be X.Y.Z, not '$VERSION'"; exit 1; }
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$REPLACE" != true ]; then
              echo "::error::$tag exists already (replace moves it while it has no release)"
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::$tag has a GitHub release: a published version is never moved"
              exit 1
            fi
            git push origin ":refs/tags/$tag"
            git tag -d "$tag"
          fi
          grep -qE "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md ||
            { echo "::error::CHANGELOG.md on main has no section '## [$VERSION] - <date>'"; exit 1; }
          bash scripts/release-notes.sh "$VERSION" >/dev/null
          git config user.name localroot4
          git config user.email atilnic@gmail.com
          git tag -a "$tag" -m "DEYROUTE $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f distro=all -f scenarios=
          echo "tagged $tag at ${GITHUB_SHA::7}; ci.yml runs at $tag and publishes it when every job passes"

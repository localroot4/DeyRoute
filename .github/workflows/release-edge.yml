# Development ("edge") releases: when the full ci.yml run of a push to main or
# the development branch passed (lint, race tests, coverage, govulncheck,
# build, smoke, integration lab), the commit that run tested is published as a
# signed GitHub release v<ver>-edge.<run>. Until the first stable release (a
# tag vX.Y.Z, published by goreleaser in ci.yml) the edge release of main is
# marked "latest", so the one-line installer works from GitHub (a build of
# the development branch is always a pre-release):
#
#   bash <(curl -fsSL https://github.com/localroot4/DeyRoute/releases/latest/download/install.sh)
#
# Once a stable tag exists, edge builds are numbered after it
# (v1.0.1-edge.<run> after v1.0.0) and published as pre-releases that never
# become "latest": the installer and `deyroute update` keep resolving to the
# stable release. A given edge build installs with --version <ver>.
#
# The trigger is workflow_run: GitHub runs it with this file as it is on the
# default branch (main), so a change here takes effect once it is on main.
# A failed ci run, a pull_request run (also one from a fork branch named main
# or dev) and a manual ci run publish nothing. A manual run of this workflow
# never publishes either: it prints the version it would build and what the
# retention would delete.
#
# Signing needs the repository secret MINISIGN_SECRET_KEY (the key whose public
# half is internal/install.MinisignPublicKey). Without it the release step is
# skipped with a notice instead of publishing unsigned files.
#
# Retention (scripts/edge-prune.sh): a tag without "-edge." (the stable
# channel), the release marked latest and the 10 newest edge builds of each
# branch are never deleted. Each release's notes end with "branch: <name>".
name: release-edge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "a manual run is always a dry run: it prints the version and the edge releases the retention would delete, and publishes nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  BASE_VERSION: 0.3.0

jobs:
  edge:
    # Only a green ci run of a push to this repository. The branches filter
    # matches the head branch name of the ci run, and ci also runs on
    # pull_request: without the last two conditions a fork PR from a branch
    # named main or dev would run this job, with the signing key and
    # contents: write, on the fork's commit.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # One publish at a time; a newer green build cancels an older one still
    # publishing. Set on the job, so that a ci run which publishes nothing
    # (failed, pull_request) cancels nothing.
    concurrency:
      group: release-edge
      cancel-in-progress: true
    env:
      # The commit and the branch the ci run tested. Under workflow_run,
      # GITHUB_SHA and GITHUB_REF_NAME are the default branch and its head.
      # Scripts read these variables; no expression is written into a script.
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: signing key present?
        id: key
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::edge release skipped: add the repository secret MINISIGN_SECRET_KEY (see README)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # tags: the last stable version
      - uses: actions/setup-go@v5
        if: steps.key.outputs.ok == 'true'
        with: { go-version: stable }
      - name: version
        if: steps.key.outputs.ok == 'true'
        run: bash scripts/edge-version.sh "$HEAD_BRANCH" >> "$GITHUB_ENV"
      - name: build
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            d="dist/deyroute_${VERSION}_linux_${arch}"
            mkdir -p "$d"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${HEAD_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "$d/deyroute" ./cmd/deyroute
            cp README.md README.en.md CHANGELOG.md LICENSE "$d/"
            tar -C dist -czf "dist/deyroute_${VERSION}_linux_${arch}.tar.gz" "deyroute_${VERSION}_linux_${arch}"
            rm -rf "$d"
          done
          # CHANGELOG.md is published and listed in SHA256SUMS: `deyroute update`
          # shows the notes of the release before it asks (spec section 5).
          cp installer/install.sh internal/backend/backends.yaml CHANGELOG.md dist/
          (cd dist && sha256sum deyroute_*.tar.gz install.sh backends.yaml CHANGELOG.md > SHA256SUMS)
      - name: sign
        if: steps.key.outputs.ok == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          go run ./scripts/minisign sign -in dist/SHA256SUMS
          go run ./scripts/minisign sign -in dist/backends.yaml
          go run ./scripts/minisign verify -in dist/SHA256SUMS -pubkey "$(grep -o 'RW[A-Za-z0-9+/=]*' internal/install/keys.go)"
      - name: publish
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases"
          if [ "$LATEST" = true ]; then
            flags=(--latest)
            install="bash <(curl -fsSL ${url}/latest/download/install.sh)"
          else
            flags=(--prerelease --latest=false)
            install="bash <(curl -fsSL ${url}/download/v${VERSION}/install.sh) --version ${VERSION}"
          fi
          title="DEYROUTE ${VERSION}"
          if [ "$LATEST" != true ]; then title="${title} (development build)"; fi
          repo="https://github.com/${GITHUB_REPOSITORY}"
          key=$(grep -o 'RW[A-Za-z0-9+/=]*' internal/install/keys.go)
          {
            echo "**Install on the hub (Iran server)** — نصب روی هاب (سرور ایران):"
            echo
            echo '```bash'
            echo "${install}"
            echo '```'
            echo
            echo "Already installed? Run \`deyroute update\` on the hub (the nodes follow)."
            echo "قبلاً نصب کرده‌اید؟ روی هاب \`deyroute update\` بزنید (نودها خودشان دنبال می‌کنند)."
            echo
            echo "## What's new"
            echo
            # The newest three sections of the changelog; the rest is linked.
            # One awk reading the file: an early exit in a pipe is SIGPIPE
            # under pipefail.
            awk '/^## \[Unreleased\]/{on=1; next}
                 on && /^## \[/{exit}
                 on { if (!seen && /^$/) next; seen=1; if (/^### /) n++; if (n > 3) exit; print }' CHANGELOG.md
            echo
            echo "[Full changelog](${repo}/blob/${HEAD_SHA}/CHANGELOG.md) · [راهنمای فارسی](${repo}/blob/main/docs/fa/index.md) · [English guides](${repo}/blob/main/docs/en/index.md)"
            echo
            echo "## Verify"
            echo
            echo "\`SHA256SUMS\` is signed with minisign; the installer and \`deyroute update\` check it before anything is installed. Public key: \`${key}\`"
            echo
            echo "Built from \`${HEAD_SHA::7}\` (Linux amd64 and arm64, static binary)."
            echo
            # Read by the retention (scripts/edge-prune.sh): the last line.
            echo "branch: ${HEAD_BRANCH}"
          } > dist/NOTES.md
          gh release create "v${VERSION}" dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.minisig \
            dist/install.sh dist/backends.yaml dist/backends.yaml.minisig dist/CHANGELOG.md \
            --target "$HEAD_SHA" "${flags[@]}" \
            --title "$title" \
            --notes-file dist/NOTES.md
      - name: retention
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/edge-prune.sh

  # A manual run is always a dry run, so nothing is published without the ci
  # gate: it prints the version a build of this branch would get and the edge
  # releases the retention would delete now. Nothing is built, published or
  # deleted.
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # tags: the last stable version
      - name: version (dry run)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != true ]; then
            echo "::notice::a manual run never publishes; edge releases come only from a green ci run of a push. Dry run."
          fi
          bash scripts/edge-version.sh "$GITHUB_REF_NAME"
          echo "nothing is published: a manual run is a dry run"
      - name: retention (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/edge-prune.sh --dry-run

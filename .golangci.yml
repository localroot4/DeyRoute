version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - ineffassign
    - unused
  settings:
    errcheck:
      # Terminal output errors are not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # G204: subprocess launched with variable — every exec goes through
        # internal/exec allow-list, which is enforced by its own test.
        - G204
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: increment-decrement
        - name: unreachable-code
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
      # The control channel serves and dials HTTP/2 on connections it owns
      # (golang.org/x/net/http2 ServeConn and Transport). x/net marks these
      # deprecated in favour of net/http, which has no per-connection
      # equivalent yet; the security fixes are in x/net v0.60.0+.
      - linters: [staticcheck]
        text: "SA1019: .*golang.org/x/net/http2"
      # Message catalogue: words such as "token" in user-facing text.
      - path: internal/i18n/
        linters: [gosec]
        text: "G101"
      - path: internal/deps/
        linters: [revive]

formatters:
  enable:
    - gofmt

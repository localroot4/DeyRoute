version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - ineffassign
    - unused
  settings:
    errcheck:
      # Terminal output errors are not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # G204: subprocess launched with variable — every exec goes through
        # internal/exec allow-list, which is enforced by its own test.
        - G204
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: increment-decrement
        - name: unreachable-code
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
      - path: internal/deps/
        linters: [revive]

formatters:
  enable:
    - gofmt

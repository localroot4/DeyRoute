version: 2
project_name: deyroute

before:
  hooks:
    - go mod verify
    - go test ./...
    # Signs internal/install/backends.yaml into dist-extra/backends.yaml.minisig
    # when MINISIGN_KEY_FILE is set (CI release job).
    - sh scripts/sign-manifest.sh

builds:
  - id: deyroute
    main: ./cmd/deyroute
    binary: deyroute
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - id: deyroute
    formats: [tar.gz]
    name_template: "deyroute_{{ .Version }}_linux_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md
      - CHANGELOG.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  extra_files:
    - glob: ./installer/install.sh
    - glob: ./internal/install/backends.yaml

# SHA256SUMS is signed with minisign; the public key is hard-coded in
# installer/install.sh and internal/install (self-update). The secret key
# is provided by CI as MINISIGN_KEY_FILE with MINISIGN_PASSWORD on stdin.
signs:
  - id: minisign-checksums
    artifacts: checksum
    cmd: sh
    args:
      - -c
      - 'printf "%s\n" "$MINISIGN_PASSWORD" | minisign -S -s "$MINISIGN_KEY_FILE" -m "${artifact}" -x "${signature}"'
    signature: "${artifact}.minisig"

release:
  extra_files:
    - glob: ./installer/install.sh
    - glob: ./internal/install/backends.yaml
    - glob: ./dist-extra/backends.yaml.minisig

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
